services:
  - type: web
    name: workshop-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build --workspace @workshop/shared && npm run build --workspace @workshop/api
    startCommand: npm run start --workspace @workshop/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_NAME
        value: workshop_session
      - key: AUTH_COOKIE_PATH_PREFIX
        value: /api
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_COOKIE_NAME
        value: workshop_refresh
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 14d
      - key: PAYMENT_PROVIDER
        value: payos
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_RETURN_URL
        sync: false
      - key: PAYOS_CANCEL_URL
        sync: false
      - key: PAYOS_WEBHOOK_URL
        sync: false
      - key: EXPIRY_JOB_INTERVAL_SECONDS
        value: '60'
      - key: DB_POOL_MAX
        value: '5'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: RANKER_URL
        value: http://localhost:8001
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
