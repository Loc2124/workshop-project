name: Open Slot email reminders

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call Render reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 300 \
            --retry 5 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://api.openslot.io.vn/cron/remind
